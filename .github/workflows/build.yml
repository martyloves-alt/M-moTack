name: Build APK

on:
  push:
    branches: [ main ]
  # Verifie la build release AVANT le merge : c'est la seule etape qui
  # exerce reellement R8, donc les regles ProGuard des rappels programmes.
  # Les tests Dart ne peuvent pas les couvrir.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` n'est pas lisible dans un `if:` d'etape : on projette
      # seulement la PRESENCE du secret, jamais sa valeur.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Complete le dossier android/ (gradle, ressources...) sans toucher aux
      # fichiers versionnes : AndroidManifest.xml, build.gradle.kts et
      # proguard-rules.pro sont conserves tels quels.
      - name: Generer le dossier Android
        run: flutter create --platforms=android .

      # Le desugaring etait auparavant injecte ici par sed. Il vit desormais
      # dans android/app/build.gradle.kts, versionne : reappliquer le sed
      # ajouterait un second bloc dependencies par-dessus.
      - name: Verifier la configuration Android versionnee
        run: |
          set -e
          for f in \
            android/app/src/main/AndroidManifest.xml \
            android/app/build.gradle.kts \
            android/app/proguard-rules.pro
          do
            [ -f "$f" ] || { echo "Fichier manquant : $f"; exit 1; }
          done
          grep -q "isCoreLibraryDesugaringEnabled = true" android/app/build.gradle.kts \
            || { echo "Desugaring absent de build.gradle.kts"; exit 1; }
          grep -q "proguard-rules.pro" android/app/build.gradle.kts \
            || { echo "Regles ProGuard non referencees"; exit 1; }
          grep -q "keepattributes Signature" android/app/proguard-rules.pro \
            || { echo "Regle Gson Signature absente"; exit 1; }
          # Un keystore versionne est un keystore compromis : il faudrait en
          # changer, donc perdre la possibilite de mettre a jour l'application
          # deja installee. On refuse le build plutot que de le laisser passer.
          if git ls-files | grep -qE '\.(jks|keystore)$|(^|/)key\.properties$'; then
            echo "Un fichier de signature est versionné dans le dépôt :"
            git ls-files | grep -E '\.(jks|keystore)$|(^|/)key\.properties$'
            exit 1
          fi
          echo "Configuration Android versionnee intacte apres flutter create."

      # Signature stable. Sans elle, Gradle retombe sur la cle de debug, que
      # le runner regenere a chaque execution : chaque APK porterait une
      # signature differente, Android refuserait la mise a jour et imposerait
      # une desinstallation, qui detruit les donnees de l'utilisateur.
      #
      # Rien n'est affiche ici : ni le keystore, ni les mots de passe, ni le
      # fichier key.properties. Les secrets ne transitent que par des
      # variables d'environnement, que GitHub masque dans les journaux.
      - name: Installer la cle de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

          # `gh secret set` depuis un fichier ou un pipe capte le saut de
          # ligne final. Un retour chariot n'est jamais un caractere de mot de
          # passe valide ici, et Gradle repondrait « keystore password was
          # incorrect » sans autre indice.
          STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')

          # Le fichier est cree avec des droits restreints avant d'etre rempli.
          install -m 600 /dev/null android/key.properties
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/app/upload-keystore.jks
          echo "Clé de signature installée."

      # Gradle ne decouvre un trousseau illisible qu'a l'etape packageRelease,
      # soit apres cinq minutes de compilation, et ne dit pas LEQUEL des deux
      # mots de passe est en cause. Ces verifications prennent une seconde et
      # nomment precisement le probleme. Aucun mot de passe n'est affiche ; le
      # DN et l'alias sont publics, presents dans tout APK distribue.
      - name: Valider le trousseau avant de construire
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -uo pipefail
          KS=android/app/upload-keystore.jks
          SP=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')
          KP=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          KA=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')

          echo "Taille du trousseau décodé : $(stat -c%s "$KS") octets"
          # Debut de l'empreinte du FICHIER, pour comparer avec
          # `sha256sum martyloves-release.jks` en local et savoir si le secret
          # contient bien le trousseau attendu. Ce n'est pas un secret : c'est
          # le hachage d'un conteneur chiffre, tronque de surcroit.
          echo "Empreinte du fichier (16 premiers caractères) : $(sha256sum "$KS" | cut -c1-16)"

          # Un secret absent arrive ici comme chaine vide. Le dire tout de
          # suite evite de chercher un probleme de mot de passe la ou c'est
          # simplement le secret qui manque.
          [ -n "$SP" ] || { echo "ÉCHEC : ANDROID_KEYSTORE_PASSWORD est vide ou absent."; exit 1; }
          [ -n "$KA" ] || { echo "ÉCHEC : ANDROID_KEY_ALIAS est vide ou absent."; exit 1; }
          [ -n "$KP" ] || { echo "ÉCHEC : ANDROID_KEY_PASSWORD est vide ou absent."; exit 1; }

          # keytool distingue lui-meme « fichier illisible » de « mot de passe
          # faux ». Ses messages ne contiennent aucun secret.
          #
          # Les deux flux sont captures ensemble : selon la version du JDK,
          # keytool ecrit son erreur sur stdout et non sur stderr, et une
          # capture de stderr seul ressort vide.
          if ! ERR=$(keytool -list -keystore "$KS" -storepass "$SP" 2>&1); then
            echo "ÉCHEC : le trousseau ne s'ouvre pas."
            case "$ERR" in
              *"Invalid keystore format"*|*"not a valid"*|*"Unrecognized"*)
                echo "→ Le fichier décodé n'est PAS un keystore."
                echo "  ANDROID_KEYSTORE_BASE64 est incomplet ou mal copié."
                echo "  À refaire avec : base64 -w 0 martyloves-release.jks" ;;
              *"password was incorrect"*)
                echo "→ Le fichier EST un keystore valide, mais"
                echo "  ANDROID_KEYSTORE_PASSWORD ne l'ouvre pas." ;;
              *)
                echo "→ cause non reconnue." ;;
            esac
            echo "--- message brut de keytool ---"
            printf '%s\n' "$ERR" | head -6
            exit 1
          fi
          echo "Mot de passe du trousseau : accepté."

          if ! keytool -list -keystore "$KS" -storepass "$SP" -alias "$KA" >/dev/null 2>&1; then
            echo "ÉCHEC : alias « $KA » introuvable. Alias présents :"
            keytool -list -keystore "$KS" -storepass "$SP" 2>/dev/null \
              | grep -i "alias name" || true
            exit 1
          fi
          echo "Alias « $KA » : trouvé."

          # -certreq a besoin de la cle privee : c'est le seul moyen simple de
          # valider le mot de passe de cle sans le modifier.
          if ! keytool -certreq -alias "$KA" -keystore "$KS" \
               -storepass "$SP" -keypass "$KP" >/dev/null 2>&1; then
            echo "ÉCHEC : ANDROID_KEY_PASSWORD ne déverrouille pas la clé."
            echo "Le trousseau et l'alias sont bons ; seul ce mot de passe cloche."
            exit 1
          fi
          echo "Mot de passe de clé : accepté."

          echo "--- certificat (données publiques) ---"
          keytool -list -v -keystore "$KS" -storepass "$SP" -alias "$KA" 2>/dev/null \
            | grep -E "Alias name|Owner|Signature algorithm|Valid from" || true

      # Sur main, un APK non signable est un APK que personne ne pourra
      # installer par-dessus le precedent : mieux vaut echouer ici.
      - name: Exiger une signature stable sur main
        if: github.ref == 'refs/heads/main' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "ANDROID_KEYSTORE_BASE64 absent des secrets du dépôt."
          echo "Sans lui, l'APK serait signé avec une clé de debug régénérée"
          echo "à chaque run, et chaque mise à jour effacerait les données."
          exit 1

      - name: Installer les dependances
        run: flutter pub get

      - name: Construire l'APK
        run: flutter build apk --release

      # Le DN et l'empreinte du certificat sont des donnees publiques,
      # presentes dans tout APK distribue : les afficher ne revele rien de la
      # cle privee.
      #
      # Le DN est le seul element qui identifie la cle. L'empreinte SHA-256
      # sert a comparer d'un run a l'autre, mais ne dit pas D'OU vient la
      # signature : c'est le DN qui distingue notre cle de release de la cle
      # de debug, laquelle porte toujours CN=Android Debug, O=Android, C=US.
      - name: Afficher l empreinte de signature
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS" | grep -iE "certificate DN|SHA-256 digest" || true

          # Un APK signe par la cle de debug n'est installable par-dessus
          # aucune version precedente : on echoue ici plutot que de publier
          # un artefact qui forcerait une desinstallation.
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "ERREUR : l'APK est signé avec la clé de DEBUG."
            echo "La clé de release n'a pas été prise en compte."
            exit 1
          fi
          echo "Signature de release confirmée (pas la clé de debug)."

      # Le keystore ne doit pas survivre au job, meme en cas d'echec.
      - name: Effacer la cle de signature
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
          echo "Clé de signature effacée du runner."

      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: memotack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
