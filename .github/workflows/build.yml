name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generer le dossier Android
        run: flutter create --platforms=android .

      - name: Activer le desugaring pour flutter_local_notifications
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$FILE"
            {
              echo ""
              echo "dependencies {"
              echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")"
              echo "}"
            } >> "$FILE"
            echo "Desugaring active dans $FILE"
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$FILE"
            {
              echo ""
              echo "dependencies {"
              echo "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              echo "}"
            } >> "$FILE"
            echo "Desugaring active dans $FILE"
          else
            echo "Fichier build.gradle introuvable dans android/app"
            exit 1
          fi

      - name: Installer les dependances
        run: flutter pub get

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: memotack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
