name: memotack
description: Application de mémorisation par répétition espacée (mots et phrases courtes).
publish_to: 'none'
version: 0.5.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  shared_preferences: ^2.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  package_info_plus: ^10.2.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
